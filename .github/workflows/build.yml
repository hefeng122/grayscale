name: build

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-latest keeps this workflow alive as GitHub retires pinned images.
    runs-on: macos-latest

    steps:
      - name: Check out repository (with MASShortcut submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain versions
        run: |
          xcode-select -p
          xcodebuild -version
          make --version | head -1

      # Smoke-test the Makefile: parse it and expand every recipe (dry run
      # executes nothing). Uses -target semantics below because the project
      # has no committed shared scheme.
      - name: Verify the Makefile parses
        run: make -n package

      - name: Build grayscale (Release, unsigned)
        run: |
          xcodebuild \
            -project grayscale.xcodeproj \
            -target grayscale \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 || true
          # If the app wasn't built, show what went wrong
          if [ ! -d build/Build/Products/Release/grayscale.app ]; then
            echo "=== Build failed, trying to diagnose ==="
            xcodebuild -project grayscale.xcodeproj -list 2>&1 || true
            echo "=== Trying build with verbose output ==="
            xcodebuild \
              -project grayscale.xcodeproj \
              -target grayscale \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              build 2>&1 || true
            echo "=== Exit code: $? ==="
            exit 1
          fi

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: grayscale.app
          path: build/Build/Products/Release/grayscale.app
          if-no-files-found: error
